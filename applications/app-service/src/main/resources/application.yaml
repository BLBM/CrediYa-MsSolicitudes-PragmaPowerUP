server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: "NameProject"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
adapters:
  r2dbc:
    host: ${R2DBC_HOST:localhost}
    port: ${R2DBC_PORT:5432}
    database: ${R2DBC_DATABASE:solicitudes_bd}
    schema: ${R2DBC_SCHEMA:public}
    username: ${R2DBC_USERNAME:postgres}
    password: ${R2DBC_PASSWORD:1234}
springdoc:
  api-docs:
    enabled: true
    path: "/v3/api-docs"
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"
    operationsSorter: "method"
    tagsSorter: "alpha"

aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID:dummy}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY:dummy}
jwt:
  secret: ${JWT_SECRET:YWRzYXNkYXNkYXNkYXNkYXNkYXNkYXNkYXNkYXNkYXNkYQ==}
  expiration: ${JWT_EXPIRATION:36000000}
adapter:
  restconsumer:
    timeout: ${RESTCONSUMER_TIMEOUT:5000}
    url: ${RESTCONSUMER_URL:http://localhost:8080/api/v1}
  sqs:
    region: ${AWS_REGION:us-east-1}
    queueUrl: ${SQS_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/302559618574/loan-application-events}


resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
