server:
  port: "${SERVER_PORT}"

spring:
  application:
    name: "NameProject"
  r2dbc:
    url: "r2dbc:postgresql://${R2DBC_HOST}:${R2DBC_PORT}/${R2DBC_DATABASE}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

cors:
  allowed-origins: ""

springdoc:
  api-docs:
    enabled: true
    path: "/v3/api-docs"
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"
    operationsSorter: "method"
    tagsSorter: "alpha"

aws:
  region: "${AWS_REGION}"

jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION}"

adapter:
  restconsumer:
    timeout: 5000
    url: "${RESTCONSUMER_URL}"
  sqs:
    region: "${AWS_REGION}"
    queues:
      loanApplicationQueue: "${SQS_LOAN_APPLICATION_QUEUE_URL}"
      loanValidateQueue: "${SQS_LOAN_VALIDATE_QUEUE_URL}"

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"

entrypoint:
  sqs:
    region: "${AWS_REGION}"
    queueUrl: "${SQS_VALIDATE_LISTENER_QUEUE_URL}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
